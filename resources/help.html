<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { zoom: {{cssZoom}}; }

    body {
      width: 720px;
      font-family: "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", "Segoe UI Emoji", sans-serif;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }

    #container {
      width: 720px;
      padding: 26px 30px 20px;
      background:
        radial-gradient(ellipse 620px 300px at 6% -10%, rgba(255, 214, 170, .42) 0%, rgba(255, 214, 170, 0) 62%),
        radial-gradient(ellipse 620px 300px at 102% 0%, rgba(178, 205, 255, .46) 0%, rgba(178, 205, 255, 0) 62%),
        radial-gradient(ellipse 560px 340px at 55% 112%, rgba(212, 194, 255, .34) 0%, rgba(212, 194, 255, 0) 68%),
        linear-gradient(165deg, #f4f7fc 0%, #e9eff9 55%, #f3f6fb 100%);
    }

    .hero { text-align: center; margin-bottom: 19px; }
    .hero .t {
      font-size: 29px; font-weight: 800; color: #33415c;
      letter-spacing: 2px;
    }
    .hero .s {
      margin-top: 7px; font-size: 12.5px; color: #8e9bb3; letter-spacing: .4px;
    }
    .hero .s .hl { color: #5b7cfa; font-weight: 600; }

    .sec {
      display: flex;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 11px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 4px 16px rgba(120, 145, 190, .12);
      border: 1px solid rgba(255, 255, 255, .9);
    }
    .sec-name {
      width: 38px; flex-shrink: 0;
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      letter-spacing: 3px;
      padding: 16px 0;
      background: linear-gradient(170deg, #7b95f8, #9a7bf0);
    }
    .sec.wz .sec-name { background: linear-gradient(170deg, #f5b04b, #e8724a); }
    .sec.more .sec-name { background: linear-gradient(170deg, #4fc3a1, #3aa0c9); }
    .sec.admin .sec-name { background: linear-gradient(170deg, #a3abbe, #7d8699); }

    .sec-body {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 14px;
      padding: 13px 16px;
    }
    .item { display: flex; gap: 7px; align-items: flex-start; }
    .item .ic { font-size: 13px; line-height: 1.55; flex-shrink: 0; width: 18px; text-align: center; }
    .item .cmd {
      font-family: "JetBrains Mono", "Consolas", monospace;
      font-size: 12.5px; font-weight: 700; color: #5271e8;
      line-height: 1.55;
    }
    .item .desc { margin-top: 1px; font-size: 11.5px; color: #7d8ba3; line-height: 1.45; }

    .foot {
      margin-top: 13px; padding-top: 12px;
      border-top: 1px dashed rgba(150, 168, 200, .38);
      text-align: center; font-size: 11.5px; color: #a8b4c8;
    }
    .foot .ver { color: #d9a441; font-weight: 700; }
    .foot .dot { color: #c3ccdc; }
  </style>
</head>
<body>
  <div id="container">
    <div class="hero">
      <div class="t">DPS · 危战 榜单</div>
      <div class="s">
        数据来源 <span class="hl">mhydps.cn</span> ｜ 每页 {{perPage}} 条 ｜ 缓存 {{cacheMin}} 分钟 ｜ 最新危战 <span class="hl">{{latestVer}}</span>
      </div>
    </div>

    {{each groups g}}
      <div class="sec {{g.cls}}">
        <div class="sec-name">{{g.name}}</div>
        <div class="sec-body">
          {{each g.items it}}
            <div class="item">
              <div class="ic">{{it.icon}}</div>
              <div>
                <div class="cmd">{{it.cmd}}</div>
                <div class="desc">{{it.desc}}</div>
              </div>
            </div>
          {{/each}}
        </div>
      </div>
    {{/each}}

    <div class="foot">千星 120 秒冷启动打桩 ｜ {{@versionHtml}}</div>
  </div>
</body>
</html>
