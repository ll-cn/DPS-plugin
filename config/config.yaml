# ===================== 原神DPS 插件配置 =====================
# 改完保存即时生效（每次查询会检查文件是否变动，不用重启）。
# 删掉本文件后，下次查询会自动重新生成这份默认配置。

# 数据缓存时长（毫秒）。官方建议 >= 5 分钟，请求太频繁会被 Cloudflare 拦。
cacheTime: 300000

# 单次请求超时（毫秒）
timeout: 25000

# 出图清晰度倍数（1=原尺寸；2=两倍像素，手机上更清晰，图也更大）
imageScale: 2

# 出图质量（0-100，越低图越小）
jpegQuality: 90

# 只发文字不发图（默认关闭；开启后所有查询都只发文字）
textOnly: false

# 榜单每页显示条数
perPage: 5

# 最多翻到第几页
maxPage: 30

# 危战「低金」筛选的金数上限（与网站低金榜口径一致）
lowCost: 2

# 角色俗称 -> 接口里的官方角色名
# 例：#dps配队 少女  → 实际查的是「哥伦比亚」
alias:
  少女: 哥伦比亚
  火王: 玛薇卡
  火神: 玛薇卡
  水神: 芙宁娜
  草神: 纳西妲
  雷神: 雷电将军
  冰神: 至冬女皇
