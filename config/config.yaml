# ===================== 原神DPS 插件配置 =====================
# 改完保存即时生效（每次查询会检查文件是否变动，不用重启）。

# 数据缓存时长（毫秒）。官方建议 >= 5 分钟，请求太频繁会被 Cloudflare 拦。
cacheTime: 300000

# 单次请求超时（毫秒）
timeout: 25000

# 榜单每页显示条数
perPage: 5

# 最多翻到第几页
maxPage: 30

# 危战「低金」筛选的金数上限（与网站低金榜口径一致）
lowCost: 2

# 角色俗称 -> 接口里的官方角色名
# 例：#dps配队 少女  → 实际查的是「哥伦比亚」
alias:
  少女: 哥伦比亚
  火王: 玛薇卡
  火神: 玛薇卡
  水神: 芙宁娜
  草神: 纳西妲
  雷神: 雷电将军
  冰神: 至冬女皇

# ===================== 外置渲染服务（可选） =====================
# 如果你跑着 Karin 的 @karinjs/puppeteer（社区俗称 pupu）这类基于 art-template
# 的渲染服务，可以让插件把图交给它渲染（复用它的常驻浏览器，少占内存）。
# 不开就保持 enable: false，走云崽自己的渲染器；开启后失败会自动回退。
renderServer:
  enable: false
  # pupu 的地址（对应它 config.json 里的 http.port）
  url: http://127.0.0.1:7006
  # 对应 pupu config.json 里的 http.token
  token: ''
  # 渲染超时（毫秒）
  timeout: 60000
